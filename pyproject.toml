[project]
name = "lookahead-lint"
version = "1.0.0"
description = "Static analyzer that flags look-ahead bias and target leakage idioms in quantitative research code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Bert Mouler" }]
keywords = [
  "look-ahead-bias",
  "data-leakage",
  "static-analysis",
  "linter",
  "quantitative-research",
  "backtesting",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "hypothesis>=6.100", "mypy>=1.14", "mutmut>=3.7"]

[project.urls]
Homepage = "https://github.com/bmouler/lookahead-lint"
Repository = "https://github.com/bmouler/lookahead-lint"

[project.scripts]
lookahead-lint = "lookahead_lint.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["lookahead_lint"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[tool.mutmut]
source_paths = ["src/lookahead_lint"]
also_copy = ["examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookahead_lint"]
